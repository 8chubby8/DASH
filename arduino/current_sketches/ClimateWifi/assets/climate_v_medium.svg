<!--
   DASH Module — Climate panel artwork        slot: v_medium (3 x 16)
   ==================================================================
   THE NARROWEST SHAPE THAT STILL HOLDS EVERYTHING.
     A 3 x 16 column is a sixteenth of its own height across — roughly
     320 px on a landscape tablet, about two fingers. Everything from
     the large panel is still here, but nothing can sit beside anything
     else except in pairs.

   THE STEPPERS TURN VERTICAL, AND THAT IS THE WHOLE DESIGN
     [-] value [+] laid across 320 px leaves the number about 100 px to
     live in, and "21.5" is four characters. So the steppers stand up:
     [+] on top, the number across the full width, [-] underneath. The
     value gets the whole column and reads at a glance.

     v_large is twice as wide and keeps its steppers horizontal. Two
     shapes, two answers — which is exactly why §6 refuses to reflow one
     layout into another's slot.

   HEIGHT IS THE ONE THING THIS SHAPE HAS. Controls are taller than
     they are wide throughout, because the shape has 1700 px of run and
     320 px of width, and a target should use whichever it has.

   IDS ARE IDENTICAL TO climate_h_large.svg.
   THE COLOURS ARE FALLBACKS, NOT THE DESIGN.
-->
