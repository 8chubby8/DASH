<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
   DASH Module — Climate panel artwork        slot: h_medium (16 x 3)
   ==================================================================
   THE SAME PANEL, RE-DRAWN — NOT THE SAME PANEL SCALED.
     module-layout.md §6: "8 x 3 and 16 x 1 are not one design at two
     sizes; they are different designs." A medium panel is half the
     height of a large one on the same screen, so nothing here is the
     large artwork resized — every control was placed again for a band
     half as tall and just as wide.

   WHAT SURVIVED, AND WHY
     Everything. All nine variables, all thirteen controls. This is the
     "compressed" slot rather than the "reduced" one — the cut happens
     in h_small.

     The two steppers turn on their side. A stacked +/value/- column
     needs height this shape does not have, so each becomes [-] value
     [+] laid across.

     The cabin keeps its stacked head/both/feet zones with the seat
     beside them. That block is the one part of the large panel that
     still fits vertically, and it is the part that carries the meaning
     — three arrows in a row aimed nowhere would say much less.

     The four mode buttons become a 2 x 2. Four across this width would
     be slivers; two by two keeps them the size of a thumb.

   IDS ARE IDENTICAL TO climate_h_large.svg. Every id a binding touches is
   spelled the same in all three slots, so the layouts differ only in
   the numbers and never in what they are pointing at.

   THE COLOURS HERE ARE FALLBACKS, NOT THE DESIGN — see climate_h_large.svg.
   THE LETTERING IS PATHS, NOT TEXT — <text> is outside the subset.
   THE LIVE NUMBERS ARE NOT HERE — they are text LAYERS in the layout.

   GLYPHS ARE LIFTED FROM climate_h_large.svg AND SCALED WITH A GROUP TRANSFORM.
     `g` and `transform` are both in the subset (svg-subset.json), and
     DASH applies the transform to the draw scope, so a scaled stroke
     scales with it. Shared shapes therefore stay literally the same
     shapes across the three slots rather than being redrawn by eye.
-->
<svg
   width="1600"
   height="300"
   viewBox="0 0 1600 300"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <rect id="bg" x="0" y="0" width="1600" height="300" fill="#101013" />

  <!-- ========================================= FAN, left — a stepper on its side -->
  <rect id="fan_panel" x="20"  y="30" width="360" height="240" rx="20" fill="#1e1e22" />
  <rect id="fan_down"  x="34"  y="44" width="84"  height="212" rx="16" fill="#1e1e22" />
  <path id="fan_down_glyph" fill="#c8c8cc"
        d="M 61 145 H 91 Q 96 145 96 150 V 150 Q 96 155 91 155 H 61 Q 56 155 56 150 V 150 Q 56 145 61 145 Z" />
  <rect id="fan_up"    x="282" y="44" width="84"  height="212" rx="16" fill="#1e1e22" />
  <path id="fan_up_glyph" fill="#c8c8cc"
        d="M 309 145 H 339 Q 344 145 344 150 V 150 Q 344 155 339 155 H 309 Q 304 155 304 150 V 150 Q 304 145 309 145 Z
           M 324 130 H 324 Q 329 130 329 135 V 165 Q 329 170 324 170 H 324 Q 319 170 319 165 V 135 Q 319 130 324 130 Z" />

  <!-- ========================================= TEMP, right — the same stepper mirrored -->
  <rect id="temp_panel" x="1220" y="30" width="360" height="240" rx="20" fill="#1e1e22" />
  <rect id="temp_down"  x="1234" y="44" width="84"  height="212" rx="16" fill="#1e1e22" />
  <path id="temp_down_glyph" fill="#c8c8cc"
        d="M 1261 145 H 1291 Q 1296 145 1296 150 V 150 Q 1296 155 1291 155 H 1261 Q 1256 155 1256 150 V 150 Q 1256 145 1261 145 Z" />
  <rect id="temp_up"    x="1482" y="44" width="84"  height="212" rx="16" fill="#1e1e22" />
  <path id="temp_up_glyph" fill="#c8c8cc"
        d="M 1509 145 H 1539 Q 1544 145 1544 150 V 150 Q 1544 155 1539 155 H 1509 Q 1504 155 1504 150 V 150 Q 1504 145 1509 145 Z
           M 1524 130 H 1524 Q 1529 130 1529 135 V 165 Q 1529 170 1524 170 H 1524 Q 1519 170 1519 165 V 135 Q 1519 130 1524 130 Z" />

  <!-- ========================================= the cabin, centre-left -->
  <!--
       The airflow zones stay stacked, and the seat stays beside them, because
       three arrows aimed at nothing is a much weaker drawing than three arrows
       aimed at a passenger. Each zone is still both the display (which
       direction is live) and the control (press to set it).
  -->
  <rect id="cabin_panel" x="396" y="30" width="304" height="240" rx="20" fill="#1e1e22" />

  <!-- HEAD -->
  <rect id="zone_head_hit" x="410" y="44" width="160" height="68" rx="12" fill="#1e1e22" />
  <path id="head_arrow" fill="none" stroke="#c8c8cc" stroke-width="5" stroke-linecap="round"
        d="M 437 78 h 84" />
  <path id="head_arrow_head" fill="#c8c8cc" d="M 518 66 l 24 12 l -24 12 z" />

  <!-- FEET + HEAD -->
  <rect id="zone_both_hit" x="410" y="118" width="160" height="68" rx="12" fill="#1e1e22" />
  <path id="both_arrow_a" fill="none" stroke="#c8c8cc" stroke-width="4.5" stroke-linecap="round"
        d="M 437 134 h 62" />
  <path id="both_head_a" fill="#c8c8cc" d="M 496 124 l 20 10 l -20 10 z" />
  <path id="both_arrow_b" fill="none" stroke="#c8c8cc" stroke-width="4.5" stroke-linecap="round"
        d="M 437 158 h 44 q 12 0 12 10" />
  <path id="both_head_b" fill="#c8c8cc" d="M 484 166 l 9 14 l 9 -14 z" />

  <!-- FEET -->
  <rect id="zone_feet_hit" x="410" y="192" width="160" height="68" rx="12" fill="#1e1e22" />
  <path id="feet_arrow" fill="none" stroke="#c8c8cc" stroke-width="5" stroke-linecap="round"
        d="M 437 212 h 60 q 14 0 14 14" />
  <path id="feet_arrow_head" fill="#c8c8cc" d="M 499 224 l 12 22 l 12 -22 z" />

  <!-- the seat the air is aimed at — climate.svg's seat, moved, not redrawn -->
  <path id="seat" fill="#3f3f47"
        d="M 663 106 H 667 Q 678 106 678 117 V 173 Q 678 184 667 184 H 663 Q 652 184 652 173 V 117 Q 652 106 663 106 Z
           M 595 170 H 667 Q 678 170 678 181 V 183 Q 678 194 667 194 H 595 Q 584 194 584 183 V 181 Q 584 170 595 170 Z" />

  <!-- the DASH chevron, tucked under the seat where nothing else fits -->
  <path id="logo" fill="#8e8e93" d="M 625 232 l 13 -22 l 13 22 l -9 0 l -4 -7 l -4 7 z" />

  <!-- ========================================= mode buttons, a 2 x 2 -->
  <rect id="mode_auto" x="716" y="30" width="180" height="114" rx="16" fill="#1e1e22" />
  <path id="auto_label" fill="#c8c8cc" transform="translate(351.00,-16.74) scale(1.9149)"
        d="m 219.45703,49.890625 -2.14062,5.804687 h 4.28906 z m -0.89062,-1.554688 h 1.78906 L 224.80078,60 h -1.64062 l -1.0625,-2.992188 h -5.25782 L 215.77734,60 h -1.66406 z m 8.75781,0 h 1.58594 v 7.085938 q 0,1.875 0.67968,2.703125 0.67969,0.820312 2.20313,0.820312 1.51562,0 2.19531,-0.820312 0.67969,-0.828125 0.67969,-2.703125 v -7.085938 h 1.58594 v 7.28125 q 0,2.28125 -1.13282,3.445313 -1.125,1.164062 -3.32812,1.164062 -2.21094,0 -3.34375,-1.164062 -1.125,-1.164063 -1.125,-3.445313 z m 11.27344,0 h 9.86718 v 1.328125 h -4.14062 V 60 h -1.58594 V 49.664062 h -4.14062 z m 17.125,1.070313 q -1.71875,0 -2.73438,1.28125 -1.00781,1.28125 -1.00781,3.492187 0,2.203125 1.00781,3.484375 1.01563,1.28125 2.73438,1.28125 1.71875,0 2.71875,-1.28125 1.00781,-1.28125 1.00781,-3.484375 0,-2.210937 -1.00781,-3.492187 -1,-1.28125 -2.71875,-1.28125 z m 0,-1.28125 q 2.45312,0 3.92187,1.648437 1.46875,1.640625 1.46875,4.40625 0,2.757813 -1.46875,4.40625 -1.46875,1.640625 -3.92187,1.640625 -2.46094,0 -3.9375,-1.640625 -1.46875,-1.640625 -1.46875,-4.40625 0,-2.765625 1.46875,-4.40625 1.47656,-1.648437 3.9375,-1.648437 z" />

  <rect id="mode_recirc" x="908" y="30" width="180" height="114" rx="16" fill="#1e1e22" />
  <g transform="translate(311.69,-16.19) scale(2.0633)">
    <path id="recirc_glyph" fill="none" stroke="#c8c8cc" stroke-width="3.5" stroke-linecap="round"
          d="M 333 62 a 16 12 0 1 1 12 -5" />
    <path id="recirc_head" fill="#c8c8cc" d="M 338 40 l 13 4 l -10 9 z" />
  </g>

  <rect id="mode_ac" x="716" y="156" width="180" height="114" rx="16" fill="#1e1e22" />
  <g transform="translate(-130.76,101.58) scale(2.0633)">
    <path id="ac_glyph" fill="none" stroke="#c8c8cc" stroke-width="3.5" stroke-linecap="round"
          d="M 454 40 V 68 M 442 47 L 466 61 M 442 61 L 466 47" />
  </g>

  <rect id="mode_screen" x="908" y="156" width="180" height="114" rx="16" fill="#1e1e22" />
  <g transform="translate(-161.60,107.41) scale(2.0633)">
    <path id="screen_glyph" fill="none" stroke="#c8c8cc" stroke-width="3.5" stroke-linejoin="round"
          d="M 549 66 q 0 -15 13 -15 q 13 0 13 15 z" />
    <path id="screen_waves" fill="none" stroke="#c8c8cc" stroke-width="2.8" stroke-linecap="round"
          d="M 554 46 q 4 -6 0 -10 M 562 46 q 4 -6 0 -10 M 570 46 q 4 -6 0 -10" />
  </g>

  <!-- ========================================= heated seats, stacked -->
  <rect id="seat_left_hit"  x="1104" y="30"  width="100" height="114" rx="16" fill="#1e1e22" />
  <g transform="translate(216.67,-294.45) scale(1.8095)">
    <path id="seat_left_body" fill="#c8c8cc"
          d="M 525 206 H 528 Q 531 206 531 209 V 229 Q 531 232 528 232 H 525 Q 522 232 522 229 V 209 Q 522 206 525 206 Z
             M 508 227 H 528 Q 531 227 531 230 V 233 Q 531 236 528 236 H 508 Q 505 236 505 233 V 230 Q 505 227 508 227 Z" />
    <path id="seat_left_heat" fill="none" stroke="#c8c8cc" stroke-width="2.8" stroke-linecap="round"
          d="M 508 198 q 4 -6 0 -11 M 516 198 q 4 -6 0 -11 M 524 198 q 4 -6 0 -11" />
  </g>

  <rect id="seat_right_hit" x="1104" y="156" width="100" height="114" rx="16" fill="#1e1e22" />
  <g transform="translate(133.43,-168.45) scale(1.8095)">
    <path id="seat_right_body" fill="#c8c8cc"
          d="M 571 206 H 574 Q 577 206 577 209 V 229 Q 577 232 574 232 H 571 Q 568 232 568 229 V 209 Q 568 206 571 206 Z
             M 554 227 H 574 Q 577 227 577 230 V 233 Q 577 236 574 236 H 554 Q 551 236 551 233 V 230 Q 551 227 554 227 Z" />
    <path id="seat_right_heat" fill="none" stroke="#c8c8cc" stroke-width="2.8" stroke-linecap="round"
          d="M 554 198 q 4 -6 0 -11 M 562 198 q 4 -6 0 -11 M 570 198 q 4 -6 0 -11" />
  </g>
</svg>
