  <path id="temp_up_glyph" fill="#c8c8cc"
        d="M 1466 44 H 1502 Q 1508 44 1508 50 V 50 Q 1508 56 1502 56 H 1466 Q 1460 56 1460 50 V 50 Q 1460 44 1466 44 Z
           M 1484 26 H 1484 Q 1490 26 1490 32 V 68 Q 1490 74 1484 74 H 1484 Q 1478 74 1478 68 V 32 Q 1478 26 1484 26 Z" />
</svg>
