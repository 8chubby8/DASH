<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
   DASH Module — Climate panel artwork         slot: v_small (1 x 16)
   ==================================================================
   THE HARDEST SHAPE IN THE SET, AND THE ONE THAT ASKS THE LEAST.
     A 1 x 16 column is a sixteenth of its own height across — about
     105 px on a landscape tablet. One finger wide. It carries the same
     four controls h_small carries, for the same reason (§6, progressive
     disclosure):

       AUTO     which is running the fan, so the fan needs no control
       A/C
       SCREEN   demist, the one control that is ever urgent
       TEMP     the thing you actually reach for

   THE NUMBER IS SMALL BECAUSE THE STRIP IS NARROW, AND THAT IS HONEST
     "21.5" is four characters and there are about 100 px to put them
     in. Every other slot gives the value more room; this one cannot,
     and stretching the panel to pretend otherwise is exactly what §6
     forbids. A user who wants a bigger number picks a bigger shape —
     which is the whole point of there being six.

   EVERYTHING IS TALLER THAN IT IS WIDE. There is no width to spend and
     1700 px of run, so every target takes its size out of the height.

   NO LOGO — see climate_h_small.svg. Every part of this shape is a
   touch target.

   IDS ARE IDENTICAL TO climate_h_large.svg for everything that appears.
-->
<svg
   width="100"
   height="1600"
   viewBox="0 0 100 1600"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <rect id="bg" x="0" y="0" width="100" height="1600" fill="#101013" />

  <!-- ========================================= AUTO -->
