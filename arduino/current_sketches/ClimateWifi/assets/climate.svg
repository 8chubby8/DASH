  <path id="temp_up_glyph" fill="#c8c8cc" d="M 710.5 65.5 H 733.5 Q 737 65.5 737 69 V 69 Q 737 72.5 733.5 72.5 H 710.5 Q 707 72.5 707 69 V 69 Q 707 65.5 710.5 65.5 Z M 722 54 H 722 Q 725.5 54 725.5 57.5 V 80.5 Q 725.5 84 722 84 H 722 Q 718.5 84 718.5 80.5 V 57.5 Q 718.5 54 722 54 Z" />
  <path id="temp_down"  fill="#1e1e22" d="M 688 204 H 756 Q 768 204 768 216 V 246 Q 768 258 756 258 H 688 Q 676 258 676 246 V 216 Q 676 204 688 204 Z" />
