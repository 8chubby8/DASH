  <path id="mode_screen" fill="#1e1e22" d="M 528 34 H 596 Q 608 34 608 46 V 62 Q 608 74 596 74 H 528 Q 516 74 516 62 V 46 Q 516 34 528 34 Z" />
  <path id="screen_glyph" fill="none" stroke="#c8c8cc" stroke-width="3.5" stroke-linejoin="round"
