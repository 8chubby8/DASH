  <path id="fan_up"    fill="#1e1e22" d="M 44 42 H 112 Q 124 42 124 54 V 84 Q 124 96 112 96 H 44 Q 32 96 32 84 V 54 Q 32 42 44 42 Z" />
  <path id="fan_up_glyph" fill="#c8c8cc" d="M 66.5 65.5 H 89.5 Q 93 65.5 93 69 V 69 Q 93 72.5 89.5 72.5 H 66.5 Q 63 72.5 63 69 V 69 Q 63 65.5 66.5 65.5 Z M 78 54 H 78 Q 81.5 54 81.5 57.5 V 80.5 Q 81.5 84 78 84 H 78 Q 74.5 84 74.5 80.5 V 57.5 Q 74.5 54 78 54 Z" />
  <path id="fan_down"  fill="#1e1e22" d="M 44 204 H 112 Q 124 204 124 216 V 246 Q 124 258 112 258 H 44 Q 32 258 32 246 V 216 Q 32 204 44 204 Z" />
  <path id="fan_down_glyph" fill="#c8c8cc" d="M 66.5 227.5 H 89.5 Q 93 227.5 93 231 V 231 Q 93 234.5 89.5 234.5 H 66.5 Q 63 234.5 63 231 V 231 Q 63 227.5 66.5 227.5 Z" />

