<!--
   DASH Module — Climate panel artwork          slot: h_large (8 x 3)
   ==================================================================
   Fan stepper left, temperature stepper right, mode buttons across the
   top, and a cabin diagram in the middle whose zones are both the
   display and the control.

   THE COLOURS HERE ARE FALLBACKS, NOT THE DESIGN.
     The layout delegates the background to @backgroundColourPrimary and
     every raised surface to @backgroundColourSecondary, with the glyphs
     and lettering on the icon and text tokens (module-layout.md §7). So
     the panel follows whatever theme the user has chosen, and the module
     never has to know what those colours are.

     The literals below are what an author sees in Inkscape, which is why
     the file stays plain, valid and previewable with no DASH-specific
     markup in it. On the tablet they are all replaced.

   NO STROKES ON THE SURFACES. A  colour replaces fill and stroke
     together (§4.3's open item), so a bordered button delegated to a
     token would lose its border into its own fill. The surfaces are flat
     fills and the separation comes from the two background tokens.

   EVERY ELEMENT A BINDING TOUCHES IS NAMED. Anything with no id is
   decoration and nothing points at it.

   THE LETTERING IS PATHS, NOT TEXT. <text> is outside the DASH subset,
   so AUTO was set in a real typeface and converted with
   Inkscape's Path > Object to Path.

   THE LIVE NUMBERS ARE NOT HERE. Fan speed and temperature are text
   LAYERS drawn by DASH from the module's values (§2), so the space under
   each label is deliberately empty artwork.
-->
<svg
   width="800"
   height="300"
   viewBox="0 0 800 300"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <rect id="bg" x="0" y="0" width="800" height="300" fill="#101013" />

  <!-- ========================================= FAN, left -->
