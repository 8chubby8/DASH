  <path id="both_head_b" fill="#c8c8cc" d="M 258 183 l 7 13 l 7 -13 z" />

  <!-- FEET -->
  <path id="zone_feet_hit" fill="#1e1e22" d="M 217 198 H 315 Q 326 198 326 209 V 231 Q 326 242 315 242 H 217 Q 206 242 206 231 V 209 Q 206 198 217 198 Z" />
  <path id="feet_arrow" fill="none" stroke="#c8c8cc" stroke-width="4" stroke-linecap="round"
