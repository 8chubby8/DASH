  <!-- ========================================= the cabin, centre -->
  <!--
       The airflow zones are the heart of the panel: each is both the display
       (which direction is live) and the control (press to set it) — the case
       module-layout.md §1 uses as its worked example of a target carrying two
       bindings, drawn for real.
  -->
  <path id="cabin_panel" fill="#1e1e22" d="M 208 88 H 592 Q 608 88 608 104 V 250 Q 608 266 592 266 H 208 Q 192 266 192 250 V 104 Q 192 88 208 88 Z" />

