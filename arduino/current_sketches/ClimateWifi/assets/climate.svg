  <path id="seat_left_body" fill="#c8c8cc" d="M 525 206 H 528 Q 531 206 531 209 V 229 Q 531 232 528 232 H 525 Q 522 232 522 229 V 209 Q 522 206 525 206 Z M 508 227 H 528 Q 531 227 531 230 V 233 Q 531 236 528 236 H 508 Q 505 236 505 233 V 230 Q 505 227 508 227 Z" />
  <path id="seat_left_heat" fill="none" stroke="#c8c8cc" stroke-width="2.8" stroke-linecap="round"
