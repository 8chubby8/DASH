  <!-- ===================================================================
       THE CONTROLS (roadmap 1.6.7)

       Three buttons, and between them they cover both halves of §8.

       MINUS and PLUS are momentary: they send `pressure_down` and
       `pressure_up` and carry no value, because "one more than whatever it
       is now" is not a value anybody can name in advance. Nothing is drawn
       optimistically for them and nothing can time out — the needle moves
       when the module says it moved.

       ZERO names the variable itself and carries a literal, so DASH knows
       exactly what to expect and draws it immediately. That is the whole
       optimistic path, and without a fixed-value control somewhere on the
       panel there would be nothing on this module to test it with.

       Each button is a background rect the touch binding points at, and a
       glyph drawn on top that nothing binds to. Splitting them that way is
       what lets press feedback recolour the button without swallowing its
       own symbol.
       =================================================================== -->
  <g id="controls">
    <rect
       id="btn_minus"
       x="320"
       y="228"
       width="105"
       height="60"
       rx="12"
       fill="#232326"
       stroke="#3a3a3d"
       stroke-width="2" />
    <rect
       id="sym_minus"
